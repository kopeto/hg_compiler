<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Charcoal background -->
  <rect width="256" height="256" rx="36" fill="#1E1E1E"/>

  <!--
    5x5 crossword grid
    cell = 42px  gap = 3px  offset = 19px  step = 45px
  -->

  <!-- Row 0  (y=19) -->
  <rect x="19"  y="19"  width="42" height="42" rx="4" fill="#0A0A0A"/>
  <rect x="64"  y="19"  width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="109" y="19"  width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="154" y="19"  width="42" height="42" rx="4" fill="#0A0A0A"/>
  <rect x="199" y="19"  width="42" height="42" rx="4" fill="#F5F5F5"/>

  <!-- Row 1  (y=64) -->
  <rect x="19"  y="64"  width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="64"  y="64"  width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="109" y="64"  width="42" height="42" rx="4" fill="#0A0A0A"/>
  <rect x="154" y="64"  width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="199" y="64"  width="42" height="42" rx="4" fill="#F5F5F5"/>

  <!-- Row 2  (y=109) - centre row: two red cells for H and G -->
  <rect x="19"  y="109" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="64"  y="109" width="42" height="42" rx="4" fill="#0A0A0A"/>
  <rect x="109" y="109" width="42" height="42" rx="4" fill="#D32F2F"/>
  <rect x="154" y="109" width="42" height="42" rx="4" fill="#D32F2F"/>
  <rect x="199" y="109" width="42" height="42" rx="4" fill="#F5F5F5"/>

  <!-- Row 3  (y=154) -->
  <rect x="19"  y="154" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="64"  y="154" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="109" y="154" width="42" height="42" rx="4" fill="#0A0A0A"/>
  <rect x="154" y="154" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="199" y="154" width="42" height="42" rx="4" fill="#F5F5F5"/>

  <!-- Row 4  (y=199) -->
  <rect x="19"  y="199" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="64"  y="199" width="42" height="42" rx="4" fill="#0A0A0A"/>
  <rect x="109" y="199" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="154" y="199" width="42" height="42" rx="4" fill="#F5F5F5"/>
  <rect x="199" y="199" width="42" height="42" rx="4" fill="#0A0A0A"/>

  <!-- White H and G on the two red cells -->
  <text x="130" y="143" font-family="Arial Black, sans-serif" font-size="26"
        font-weight="900" text-anchor="middle" dominant-baseline="middle"
        fill="#F5F5F5">H</text>
  <text x="175" y="143" font-family="Arial Black, sans-serif" font-size="26"
        font-weight="900" text-anchor="middle" dominant-baseline="middle"
        fill="#F5F5F5">G</text>
</svg>
